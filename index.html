<!doctype html>
<html>

<head>

  <title>Premium Cozy Living Room</title>


  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {

      overflow: hidden;

      background: #120a05;

      font-family: "Segoe UI", Arial, sans-serif;

    }



    /* =====================
   Title
===================== */


    #title {

      position: fixed;

      top: 30px;

      left: 35px;

      color: white;

      z-index: 10;

    }



    #title h1 {

      font-size: 28px;

      font-weight: 600;

      letter-spacing: 1px;

    }



    #title p {

      margin-top: 8px;

      color: #e6c27a;

      font-size: 14px;

      letter-spacing: 2px;

    }







    /* =====================
   Control Button
===================== */


    #controlBtn {


      position: fixed;


      right: 30px;


      top: 30px;



      padding: 12px 22px;



      border-radius: 25px;



      border: 1px solid rgba(255, 200, 100, 0.25);



      background: rgba(20, 15, 10, 0.7);



      color: #ffd166;



      font-size: 15px;



      font-weight: bold;



      cursor: pointer;



      backdrop-filter: blur(12px);



      z-index: 20;


    }



    #controlBtn:hover {

      background: rgba(255, 200, 100, 0.15);

    }







    /* =====================
   Control Panel
===================== */


    #panel {


      position: fixed;


      right: 30px;


      top: 85px;


      width: 270px;


      padding: 25px;


      color: white;



      background: rgba(20, 15, 10, 0.65);



      border: 1px solid rgba(255, 200, 100, 0.25);



      border-radius: 20px;



      backdrop-filter: blur(12px);



      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);



      display: none;



      z-index: 15;


    }





    #panel h2 {


      font-size: 18px;


      color: #ffd166;


      margin-bottom: 18px;


      letter-spacing: 2px;


    }





    .control {


      display: flex;


      justify-content: space-between;


      padding: 10px 0;



      border-bottom: 1px solid rgba(255, 255, 255, 0.08);



      font-size: 14px;


    }




    .key {


      color: #ffd166;


      font-weight: bold;


    }







    /* =====================
   Status
===================== */


    #status {


      position: fixed;


      bottom: 30px;


      left: 35px;


      padding: 12px 22px;


      border-radius: 30px;


      color: white;



      background: rgba(20, 15, 10, 0.65);



      backdrop-filter: blur(10px);



      border: 1px solid rgba(255, 200, 100, 0.2);



      font-size: 14px;



      z-index: 10;


    }
  </style>


</head>





<body>


  <!-- Title -->


  <div id="title">

    <h1>
      Premium Cozy Living Room
    </h1>


    <p>
      COMPUTER GRAPHICS
    </p>


  </div>







  <!-- Control Button -->


  <button id="controlBtn">

    CONTROLS

  </button>







  <!-- Controls -->


  <div id="panel">


    <h2>
      CONTROLS
    </h2>




    <div class="control">

      <span>
        Rotate View
      </span>

      <span class="key">
        Mouse Drag
      </span>

    </div>





    <div class="control">

      <span>
        Top View / Zoom
      </span>

      <span class="key">
        Wheel
      </span>

    </div>





    <div class="control">

      <span>
        Toggle Lamp
      </span>

      <span class="key">
        L
      </span>

    </div>





    <div class="control">

      <span>
        Light Switch
      </span>

      <span class="key">
        Click Lamp
      </span>

    </div>



  </div>







  <div id="status">

    ● Interactive Lamp Enabled

  </div>







  <script type="module" src="/src/main.js"></script>



  <script>


    const button =
      document.getElementById("controlBtn");


    const panel =
      document.getElementById("panel");



    button.onclick = function () {


      if (panel.style.display === "block") {

        panel.style.display = "none";

      }

      else {

        panel.style.display = "block";

      }


    };


  </script>



</body>

</html>
